Fdiv>\n\n                <div style=\"border-radius:22px;background:#33206B;box-shadow:0 4px 0 #1C1040;padding:14px;display:flex;flex-direction:column;gap:12px\">\n                  <div style=\"font-size:11.5px;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#8F79D4\">Nudges<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:9px\">\n                    <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:26px;height:26px;border-radius:9px;background:#FFB020;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#3B2400\">1<\u002Fdiv><div style=\"flex:1;font-size:15px;font-weight:800;color:#FFF6E8\">A category for the answer<\u002Fdiv><div style=\"font-size:13px;font-weight:900;color:#8F79D4\">1 coin<\u002Fdiv><\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:26px;height:26px;border-radius:9px;background:#FFB020;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#3B2400\">2<\u002Fdiv><div style=\"flex:1;font-size:15px;font-weight:800;color:#FFF6E8\">The first letter<\u002Fdiv><div style=\"font-size:13px;font-weight:900;color:#8F79D4\">1 coin<\u002Fdiv><\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:26px;height:26px;border-radius:9px;background:#FFB020;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#3B2400\">3<\u002Fdiv><div style=\"flex:1;font-size:15px;font-weight:800;color:#FFF6E8\">The whole answer<\u002Fdiv><div style=\"font-size:13px;font-weight:900;color:#8F79D4\">1 coin<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:14px;font-weight:700;color:#9C8AD0;line-height:1.4\">They unlock in that order, up to three per puzzle. Using one doesn't change anything about your solve.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"height:28px;display:flex;align-items:center;justify-content:center\"><div style=\"width:134px;height:5px;border-radius:3px;background:rgba(255,243,222,0.32)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showCaptions }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:3px;padding-left:10px\">\n              <div style=\"font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#3A2A18\">17 · How to Play — dark<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:700;color:#8C7A66\">Returns to the exact puzzle state, typed input intact<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"width:414px;padding:12px;background:#0C0718;border-radius:58px;box-shadow:0 24px 60px rgba(30,16,52,0.4)\">\n            <div data-screen-label=\"18 Stats · dark\" style=\"width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:radial-gradient(115% 70% at 50% 0%, #2E1C60 0%, #211447 55%, #1A0F38 100%)\">\n              <div style=\"position:absolute;top:11px;left:50%;transform:translateX(-50%);width:106px;height:30px;border-radius:16px;background:#0C0718;z-index:3\"><\u002Fdiv>\n              <div style=\"height:54px;padding:19px 26px 0;display:flex;align-items:flex-start;justify-content:space-between;font-size:14px;font-weight:800;color:#FFF3DE\"><div>9:41<\u002Fdiv><div style=\"display:flex;align-items:center;gap:5px\"><div style=\"width:16px;height:10px;border-radius:2px;background:#FFF3DE\"><\u002Fdiv><div style=\"width:22px;height:11px;border-radius:3px;border:1.6px solid #FFF3DE;padding:1.5px;box-sizing:border-box\"><div style=\"width:72%;height:100%;border-radius:1px;background:#FFF3DE\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n              <div style=\"height:60px;padding:6px 18px 0;display:flex;align-items:center;justify-content:space-between\">\n                <div style=\"width:46px;height:46px;border-radius:16px;background:#33206B;box-shadow:0 3px 0 #1C1040;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:26px;font-weight:800;color:#B29CE8;line-height:1;padding-bottom:4px\">‹<\u002Fdiv>\n                <div style=\"font-family:'Baloo 2',cursive;font-size:26px;font-weight:800;color:#FFF6E8\">STATS<\u002Fdiv>\n                <div style=\"width:46px;height:46px\"><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1;padding:12px 20px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden\">\n                <div style=\"display:flex;gap:10px\">\n                  <div style=\"flex:1;border-radius:20px;background:#33206B;box-shadow:0 4px 0 #1C1040;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:4px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:30px;font-weight:800;color:#FF7F5F;line-height:1\">12<\u002Fdiv>\n                    <div style=\"font-size:10.5px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#A392D2\">Streak<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;border-radius:20px;background:#33206B;box-shadow:0 4px 0 #1C1040;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:4px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:30px;font-weight:800;color:#FFB020;line-height:1\">21<\u002Fdiv>\n                    <div style=\"font-size:10.5px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#A392D2\">Longest<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;border-radius:20px;background:#33206B;box-shadow:0 4px 0 #1C1040;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:4px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:30px;font-weight:800;color:#2ED3C0;line-height:1\">148<\u002Fdiv>\n                    <div style=\"font-size:10.5px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#A392D2\">Solved<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"border-radius:22px;background:#33206B;box-shadow:0 4px 0 #1C1040;padding:18px;display:flex;flex-direction:column;gap:12px\">\n                  <div style=\"font-size:11.5px;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#8F79D4\">Last five weeks<\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:7px\">\n                    <sc-for list=\"{{ heatDark }}\" as=\"h\" hint-placeholder-count=\"35\">\n                      <div style=\"height:32px;border-radius:10px;background:{{ h.bg }}\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px;padding-top:2px\">\n                    <div style=\"width:14px;height:14px;border-radius:5px;background:#251652\"><\u002Fdiv>\n                    <div style=\"font-size:12.5px;font-weight:800;color:#7C68B8\">not played<\u002Fdiv>\n                    <div style=\"width:14px;height:14px;border-radius:5px;background:#17A398;margin-left:8px\"><\u002Fdiv>\n                    <div style=\"font-size:12.5px;font-weight:800;color:#7C68B8\">solved<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"border-radius:22px;background:#33206B;box-shadow:0 4px 0 #1C1040;padding:18px;display:flex;flex-direction:column;gap:14px\">\n                  <div style=\"font-size:11.5px;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#8F79D4\">Your packs<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:12px\">\n                    <div style=\"display:flex;flex-direction:column;gap:7px\">\n                      <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"display:flex;align-items:center;gap:11px\"><div style=\"font-size:16px;font-weight:800;color:#FFF6E8\">Cozy Kitchen<\u002Fdiv><\u002Fdiv><div style=\"font-size:13.5px;font-weight:900;color:#1FBFB0\">12 / 30<\u002Fdiv><\u002Fdiv>\n                      <div style=\"height:12px;border-radius:999px;background:#251652;overflow:hidden\"><div style=\"width:40%;height:100%;border-radius:999px;background:#1FBFB0\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:7px\">\n                      <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"display:flex;align-items:center;gap:11px\"><div style=\"font-size:16px;font-weight:800;color:#FFF6E8\">Garden Path<\u002Fdiv><\u002Fdiv><div style=\"font-size:13.5px;font-weight:900;color:#1FBFB0\">3 / 30<\u002Fdiv><\u002Fdiv>\n                      <div style=\"height:12px;border-radius:999px;background:#251652;overflow:hidden\"><div style=\"width:10%;height:100%;border-radius:999px;background:#1FBFB0\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"height:28px;display:flex;align-items:center;justify-content:center\"><div style=\"width:134px;height:5px;border-radius:3px;background:rgba(255,243,222,0.32)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ showCaptions }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:3px;padding-left:10px\">\n              <div style=\"font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#3A2A18\">18 · Stats — dark<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:700;color:#8C7A66\">Heatmap is teal-only — no intensity scale, no colour that means bad<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showCaptions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Presentation&quot;}}\">\nclass Component extends DCLogic {\n  buildPack(theme) {\n    const solved = [1, 2, 3, 4, 6, 7, 9, 12, 13, 17, 22, 26];\n    const on = theme === \"light\"\n      ? { bg: \"#17A398\", edge: \"#0E7A72\", fg: \"#EAFFFC\" }\n      : { bg: \"#17A398\", edge: \"#0B655F\", fg: \"#EAFFFC\" };\n    const off = theme === \"light\"\n      ? { bg: \"#FFFFFF\", edge: \"#E4CFA8\", fg: \"#B4A183\" }\n      : { bg: \"#33206B\", edge: \"#1C1040\", fg: \"#8F79D4\" };\n    return Array.from({ length: 30 }, (_, i) => {\n      const n = i + 1;\n      return Object.assign({ n }, solved.includes(n) ? on : off);\n    });\n  }\n  buildHeat(theme) {\n    const played = [0,1,2,4,5,6,7,8,10,11,12,13,14,15,17,18,19,20,21,22,24,25,26,27,28,29,31,32,33];\n    const solvedBg = \"#17A398\";\n    const emptyBg = theme === \"light\" ? \"#F3E3C4\" : \"#251652\";\n    return Array.from({ length: 35 }, (_, i) => ({ bg: played.includes(i) ? solvedBg : emptyBg }));\n  }\n  renderVals() {\n    return {\n      showCaptions: this.props.showCaptions ?? true,\n      packLight: this.buildPack(\"light\"),\n      packDark: this.buildPack(\"dark\"),\n      heatLight: this.buildHeat(\"light\"),\n      heatDark: this.buildHeat(\"dark\")\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
