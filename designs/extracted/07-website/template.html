size:20px;font-weight:800;color:#4A3000;transform:rotate(4deg)\">H<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;letter-spacing:0.02em;color:#3A2A18;margin-left:6px\">WORD HUG<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:30px\">\n                <div style=\"font-size:16px;font-weight:800;color:#6E5B44\">How it works<\u002Fdiv>\n                <div style=\"font-size:16px;font-weight:800;color:#6E5B44\">Hug Packs<\u002Fdiv>\n                <div style=\"font-size:16px;font-weight:800;color:#6E5B44\">About<\u002Fdiv>\n                <div style=\"font-size:16px;font-weight:800;color:#6E5B44\">Contact<\u002Fdiv>\n                <div style=\"height:50px;padding:0 24px;border-radius:16px;background:#FFB020;box-shadow:0 4px 0 #D98A00;display:flex;align-items:center;font-family:'Baloo 2',cursive;font-size:18px;font-weight:800;letter-spacing:0.04em;color:#4A3000\">GET THE APP<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:72px 64px 80px;background:radial-gradient(90% 120% at 18% 0%, #FFE6B4 0%, #FFF4E2 55%, #FFF9EF 100%);display:flex;gap:64px;align-items:center\">\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:26px\">\n                <div style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:#FFFFFF;box-shadow:0 3px 0 #E4CFA8\">\n                  <div style=\"width:9px;height:9px;border-radius:999px;background:#FF6B4A\"><\u002Fdiv>\n                  <div style=\"font-size:14px;font-weight:900;letter-spacing:0.06em;color:#7A6852\">A new puzzle every morning<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:'Baloo 2',cursive;font-size:76px;font-weight:800;line-height:1.02;letter-spacing:-0.02em;color:#3A2A18;text-wrap:pretty\">Three words.<br>One word that<br>hugs all three.<\u002Fdiv>\n                <div style=\"font-size:21px;font-weight:700;color:#6E5B44;line-height:1.5;max-width:44ch;text-wrap:pretty\">One minute a day, no timer, no score, nothing to lose. Miss a morning and the last seven days stay open — you can always catch up.<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:16px;padding-top:6px\">\n                  <div style=\"height:66px;padding:0 34px;border-radius:20px;background:#FFB020;box-shadow:0 5px 0 #D98A00;display:flex;align-items:center;font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;letter-spacing:0.05em;color:#4A3000\">APP STORE<\u002Fdiv>\n                  <div style=\"height:66px;padding:0 34px;border-radius:20px;background:#FFFFFF;box-shadow:0 5px 0 #E4CFA8;display:flex;align-items:center;font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;letter-spacing:0.05em;color:#6E5B44\">GOOGLE PLAY<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:700;color:#7A6852\">Free, with optional puzzle packs. No ads, no accounts, no data leaves your phone.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"width:520px;background:#FFF9EF;border-radius:32px;box-shadow:0 8px 0 #E4CFA8;padding:32px;display:flex;flex-direction:column;gap:20px\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between\">\n                  <div style=\"font-size:12px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#7A6852\">Try today's<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:#FFF0CE\"><div style=\"width:20px;height:20px;border-radius:999px;background:#FFB020;box-shadow:inset 0 -3px 0 rgba(158,102,0,0.35)\"><\u002Fdiv><div style=\"font-size:14px;font-weight:900;color:#7A6852\">Nudge<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:11px\">\n                  <div style=\"height:76px;border-radius:22px;background:#FFFFFF;box-shadow:0 4px 0 #EBD6B0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:36px;font-weight:800;color:#3A2A18\">GREEN<\u002Fdiv>\n                  <div style=\"height:76px;border-radius:22px;background:#FFFFFF;box-shadow:0 4px 0 #EBD6B0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:36px;font-weight:800;color:#3A2A18\">BOAT<\u002Fdiv>\n                  <div style=\"height:76px;border-radius:22px;background:#FFFFFF;box-shadow:0 4px 0 #EBD6B0;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:36px;font-weight:800;color:#3A2A18\">LIGHT<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <div style=\"flex:1;display:flex;gap:8px\">\n                    <div style=\"flex:1 1 0;min-width:0;height:66px;border-radius:17px;background:#FFFFFF;box-shadow:0 4px 0 #E4CFA8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:30px;font-weight:800;color:#3A2A18\">H<\u002Fdiv>\n                    <div style=\"flex:1 1 0;min-width:0;height:66px;border-radius:17px;background:#FFFFFF;box-shadow:0 4px 0 #E4CFA8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:30px;font-weight:800;color:#3A2A18\">O<\u002Fdiv>\n                    <div style=\"flex:1 1 0;min-width:0;height:66px;border-radius:17px;background:#FFF7E6;box-shadow:inset 0 0 0 3px #FFB020, 0 4px 0 #E9A413;display:flex;align-items:center;justify-content:center;box-sizing:border-box\"><div style=\"width:3px;height:30px;border-radius:2px;background:#FFB020\"><\u002Fdiv><\u002Fdiv>\n                    <div style=\"flex:1 1 0;min-width:0;height:66px;border-radius:17px;background:#F6E9CE;box-shadow:inset 0 3px 0 rgba(160,130,80,0.22)\"><\u002Fdiv>\n                    <div style=\"flex:1 1 0;min-width:0;height:66px;border-radius:17px;background:#F6E9CE;box-shadow:inset 0 3px 0 rgba(160,130,80,0.22)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"width:66px;height:66px;border-radius:20px;background:#FFB020;box-shadow:0 5px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#4A3000\">→<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px\">\n                  <div style=\"flex:1 1 0;height:56px;border-radius:15px;background:#E8D8B8;box-shadow:0 3px 0 #D6C4A2;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;color:#8A7758\">H<\u002Fdiv>\n                  <div style=\"flex:1 1 0;height:56px;border-radius:15px;background:#E8D8B8;box-shadow:0 3px 0 #D6C4A2;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;color:#8A7758\">O<\u002Fdiv>\n                  <div style=\"flex:1 1 0;height:56px;border-radius:15px;background:#FFF0CE;box-shadow:0 3px 0 #E9D6A8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;color:#5E4C36\">U<\u002Fdiv>\n                  <div style=\"flex:1 1 0;height:56px;border-radius:15px;background:#FFF0CE;box-shadow:0 3px 0 #E9D6A8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;color:#5E4C36\">S<\u002Fdiv>\n                  <div style=\"flex:1 1 0;height:56px;border-radius:15px;background:#FFF0CE;box-shadow:0 3px 0 #E9D6A8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;color:#5E4C36\">E<\u002Fdiv>\n                  <div style=\"flex:1 1 0;height:56px;border-radius:15px;back le=\"display:flex;gap:8px;flex-wrap:wrap\">\n                    <div style=\"padding:11px 16px;border-radius:13px;background:#FFFFFF;box-shadow:0 3px 0 #E4CFA8;font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#6E5B44\">GREEN<\u002Fdiv>\n                    <div style=\"padding:11px 16px;border-radius:13px;background:#FFFFFF;box-shadow:0 3px 0 #E4CFA8;font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#6E5B44\">BOAT<\u002Fdiv>\n                    <div style=\"padding:11px 16px;border-radius:13px;background:#FFFFFF;box-shadow:0 3px 0 #E4CFA8;font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#6E5B44\">LIGHT<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:16.5px;font-weight:700;color:#7C6A55;line-height:1.5\">Unrelated on the surface. They all hide the same partner.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:16px\">\n                  <div style=\"width:44px;height:44px;border-radius:14px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;color:#4A3000\">2<\u002Fdiv>\n                  <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Spell the hug word<\u002Fdiv>\n                  <div style=\"display:flex;gap:8px\">\n                    <div style=\"width:50px;height:58px;border-radius:15px;background:#FFFFFF;box-shadow:0 4px 0 #E4CFA8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:26px;font-weight:800;color:#3A2A18\">H<\u002Fdiv>\n                    <div style=\"width:50px;height:58px;border-radius:15px;background:#FFFFFF;box-shadow:0 4px 0 #E4CFA8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:26px;font-weight:800;color:#3A2A18\">O<\u002Fdiv>\n                    <div style=\"width:50px;height:58px;border-radius:15px;background:#F6E9CE;box-shadow:inset 0 3px 0 rgba(160,130,80,0.22)\"><\u002Fdiv>\n                    <div style=\"width:50px;height:58px;border-radius:15px;background:#F6E9CE;box-shadow:inset 0 3px 0 rgba(160,130,80,0.22)\"><\u002Fdiv>\n                    <div style=\"width:50px;height:58px;border-radius:15px;background:#F6E9CE;box-shadow:inset 0 3px 0 rgba(160,130,80,0.22)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:16.5px;font-weight:700;color:#7C6A55;line-height:1.5\">The slots tell you the length. Letters you place stay put.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:16px\">\n                  <div style=\"width:44px;height:44px;border-radius:14px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:22px;font-weight:800;color:#4A3000\">3<\u002Fdiv>\n                  <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">See why it works<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:7px\">\n                    <div style=\"display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;column-gap:1px\"><div style=\"text-align:right;font-size:18px;font-weight:800;color:#3A2A18\">GREEN<\u002Fdiv><div style=\"font-size:18px;font-weight:800;color:#0E7A72\">HOUSE<\u002Fdiv><div><\u002Fdiv><\u002Fdiv>\n                    <div style=\"display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;column-gap:1px\"><div><\u002Fdiv><div style=\"font-size:18px;font-weight:800;color:#0E7A72\">HOUSE<\u002Fdiv><div style=\"text-align:left;font-size:18px;font-weight:800;color:#3A2A18\"> or:#B8A68F;line-height:1.55\">A small daily word puzzle, made by two people who wanted one that didn't shout.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:70px\">\n                  <div style=\"display:flex;flex-direction:column;gap:12px\">\n                    <div style=\"font-size:11.5px;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#C4B49C\">Play<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">How it works<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">Hug Packs<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">Get the app<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:12px\">\n                    <div style=\"font-size:11.5px;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#C4B49C\">Company<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">About<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">Contact<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">Press kit<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:12px\">\n                    <div style=\"font-size:11.5px;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#C4B49C\">Legal<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">Privacy Policy<\u002Fdiv>\n                    <div style=\"font-size:15.5px;font-weight:800;color:#EFE3D2\">Terms of Service<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:1.5px;background:#4E3B26\"><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                <div style=\"font-size:14px;font-weight:700;color:#C4B49C\">© 2026 Word Hug<\u002Fdiv>\n                <div style=\"font-size:14px;font-weight:700;color:#C4B49C\">hello@wordhug.app<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:3px;padding-left:10px\">\n            <div style=\"font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#3A2A18\">Landing<\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:700;color:#8C7A66\">Hero is the real puzzle UI, playable in the browser · one amber CTA per band<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:48px;flex-wrap:wrap\">\n\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div data-screen-label=\"Web · About\" style=\"width:1440px;background:#FFF9EF;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(58,42,24,0.22)\">\n              <div style=\"height:88px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;background:#FFF4E2\">\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <div style=\"display:flex;gap:4px\">\n                    <div style=\"width:32px;height:38px;border-radius:11px;background:#FFFFFF;box-shadow:0 3px 0 #E4CFA8;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;color:#3A2A18;transform:rotate(-4deg)\">W<\u002Fdiv>\n                    <div style=\"width:32px;height:38px;border-radius:11px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:20px;font-weight:800;color:#4A3000;transform:rotate(4deg)\">H<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-family:'Baloo 2',cursive;font-size:24px;font-weight:800;letter-spacing:0.02em;color:#3A2A18;margin-left:6px\">WORD HUG<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:30px\">\n                  <div style=\"font-size:16px;font-weight:800;color:#6E5B44\">How it works<\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:800;color:#6E5B44\">Hug Packs<\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:900;color:#3A2A18;border-bottom:3px solid #FFB020;padding-bottom:3px\">About<\u002Fdiv>\n                  <div style=\"font-size:16px;font-weight:800;color:#6E5B44\">Contact<\u002Fdiv>\n                  <div style=\"height:50px;padding:0 24px;border-radius:16px;background:#FFB020;box-shadow:0 4px 0 #D98A00;display:flex;align-items:center;font-family:'Baloo 2',cursive;font-size:18px;font-weight:800;letter-spacing:0.04em;color:#4A3000\">GET THE APP<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:70px 64px 60px;background:radial-gradient(90% 140% at 20% 0%, #FFE6B4 0%, #FFF4E2 60%, #FFF9EF 100%);display:flex;flex-direction:column;gap:20px\">\n                <div style=\"font-size:12px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#7A6852\">About<\u002Fdiv>\n                <div style=\"font-family:'Baloo 2',cursive;font-size:62px;font-weight:800;line-height:1.05;letter-spacing:-0.015em;color:#3A2A18;max-width:26ch;text-wrap:pretty\">We wanted a puzzle that didn't shout at us<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:60px 64px 70px;display:flex;gap:56px\">\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:26px\">\n                  <div style=\"font-size:22px;font-weight:800;color:#3A2A18;line-height:1.5;text-wrap:pretty\">Word Hug started as a note in a phone: three words, one that fits all three. Nothing more.<\u002Fdiv>\n                  <div style=\"font-size:17.5px;font-weight:700;color:#6E5B44;line-height:1.65;text-wrap:pretty\">Every daily puzzle app we tried came with a stopwatch, a percentile, and a push notification telling us our streak was in danger. We liked the puzzle part. We didn't like being managed by it.<\u002Fdiv>\n                  <div style=\"font-size:17.5px;font-weight:700;color:#6E5B44;line-height:1.65;text-wrap:pretty\">So the rules of the app are the rules we wanted for ourselves. One puzzle a day, about a minute. No clock. Six tries, and if you use a nudge, nothing about your solve changes — no asterisk, no smaller confetti. The last seven days stay open so a missed morning isn't a loss. There is one number in the whole game, and it's there because people asked for it, not because it makes you come back.<\u002Fdiv>\n                  <div style=\"font-size:17.5px;font-weight:700;color:#6E5B44;line-height:1.65;text-wrap:pretty\">We pay for it with Hug Packs — thirty themed puzzles, bought once, yours forever. The daily puzzle stays free because it's the whole point. There are no ads, no accounts, and nothing about your play leaves your phone.<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:14px;padding-top:6px\">\n                    <div style=\"font-size:12px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#7A6852\">Who's making it<\u002Fdiv>\n                    <div style=\"display:flex;gap:16px\">\n                      <div style=\"flex:1;border-radius:24px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:18px;display:flex;flex-direction:column;gap:14px\">\n                        <image-slot compact=\"\" id=\"web-about-1\" radius=\"16\" placeholder=\"Photo\" style=\"width:100%;height:120px\"><\u002Fimage-slot>\n                        <div style=\"display:flex;flex-direction:column;gap:4px;padding:0 4px 4px\">\n                          <div style=\"font-family:'Baloo 2',cursive;font-size:21px;font-weight:800;color:#3A2A18\">Mara Ellery<\u :10px\">\n                  <div style=\"font-size:12px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#7A6852;padding-left:4px;padding-bottom:6px\">On this page<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFB020;box-shadow:0 3px 0 #D98A00;font-size:16px;font-weight:900;color:#4A3000\">What stays on your phone<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">What we do collect<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Purchases<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Notifications<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Children<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Your rights<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Changes &amp; contact<\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:16px\">\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:center;gap:14px\">\n                      <div style=\"width:34px;height:34px;border-radius:11px;background:#17A398;box-shadow:0 3px 0 #0E7A72;display:flex;align-items:center;justify-content:center;font-size:16px;color:#EAFFFC\">✓<\u002Fdiv>\n                      <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">What stays on your phone<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Your solves, your streak, your nudge balance, which packs you own, and your reminder time are stored only on your device. We never receive them, and we can't see them. If you delete Word Hug, that data goes with it — which also means we can't restore it for you, apart from purchases.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">What we do collect<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Two things, both optional and neither tied to your identity:<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:11px\">\n                      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:#FFF9EF\">\n                        <div style=\"width:24px;height:24px;border-radius:8px;background:#FFB020;flex-shrink:0;margin-top:2px\"><\u002Fdiv>\n                        <div style=\"flex:1;font-size:16.5px;font-weight:700;color:#6E5B44;line-height:1.5\"><span style=\"font-weight:900;color:#3A2A18\">Crash reports.<\u002Fspan> If the app fails, your phone's operating system may send us a technical report. It contains device model and OS version, not your puzzles. You can switch this off in your system settings.<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:#FFF9EF\">\n                        <div style=\"width:24px;height:24px;border-radius:8px;background:#FFB020;flex-shrink:0;margin-top:2px\"><\u002Fdiv>\n                        <div style=\"flex:1;font-size:16.5px;font-weight:700;color:#6E5B44;line-height:1.5\"><span style=\"font-weight:900;color:#3A2A18\">Emails you send us.<\u002Fspan> If you write to us, we keep the thread so we can reply. We delete support threads after twelve months and never add your address to a mailing list.<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">There are no ads, no analytics SDKs, no advertising identifiers, and no third-party trackers in the app.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Purchases<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Hug Packs and nudge coins are sold by Apple and Google, not by us. They handle payment and tell the app what you own; we never see your card details, billing address, or full name. Restoring purchases asks the store, not us. Their privacy policies apply to that part of the transaction.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Notifications<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">The daily reminder is scheduled locally on your phone at the time you pick. Nothing is sent from a server, so we don't hold a push token or know whether you opened it. Turning reminders off in Settings stops them completely.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Children<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Word Hug is suitable for all ages and we don't knowingly collect personal information from anyone, including children. Because there are no accounts and no profiles, there's nothing to collect. Purchases are governed by the parental controls in your app store.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Your rights<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Under the UK GDPR and similar laws you can ask what we hold about you, ask for a copy, or ask us to delete it. In practice the only thing we could ever hold is an email thread you started. Write to hello@wordhug.app and we'll deal with it within thirty days. If you're unhappy with our response you can complain to your local data protection authority.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF9EF;box-shadow:0 5px 0 #E4CFA8;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Changes &amp; contact<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">If this policy changes we'll update the date above and note what changed. Material changes will also be mentioned in the app. Questions to hello@wordhug.app — a real person reads it.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:44px 64px;background:#3A2A18;display:flex;justify-content:space-between;align-items:center\">\n                <div style=\"font-size:14px;font-weight:700;color:#C4B49C\">© 2026 Word Hug<\u002Fdiv>\n                <div style=\"display:flex;gap:28px\">\n                  <div style=\"font-size:15px;font-weight:800;color:#EFE3D2\">About<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:800;color:#EFE3D2\">Contact<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:800;color:#EFE3D2\">Terms of Service<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;padding-left:10px\">\n              <div style=\"font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#3A2A18\">Privacy Policy<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:700;color:#8C7A66\">Plain language, tile cards, sticky contents · summary before the detail<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div data-screen-label=\"Web · Terms of Service\" style=\"width:1440px;background:#FFF9EF;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(58,42,24,0.22)\">\n              <div style=\"height:88px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;background:#FFF4E2\">\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <div style=\"display:f 2em;text-transform:uppercase;color:#7A6852\">Legal<\u002Fdiv>\n                  <div style=\"font-family:'Baloo 2',cursive;font-size:58px;font-weight:800;line-height:1.05;letter-spacing:-0.015em;color:#3A2A18\">Terms of Service<\u002Fdiv>\n                  <div style=\"font-size:19px;font-weight:700;color:#6E5B44;line-height:1.5;max-width:54ch;text-wrap:pretty\">The short version: play the game, don't resell the puzzles, packs are yours once bought, and refunds go through your app store.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 22px;border-radius:16px;background:#FFFFFF;box-shadow:0 4px 0 #E4CFA8;font-size:15px;font-weight:900;color:#6E5B44\">Updated 1 August 2026<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:56px 64px 70px;display:flex;gap:48px\">\n                <div style=\"width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"font-size:12px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#7A6852;padding-left:4px;padding-bottom:6px\">On this page<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFB020;box-shadow:0 3px 0 #D98A00;font-size:16px;font-weight:900;color:#4A3000\">Using Word Hug<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Purchases &amp; refunds<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Your progress<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Our content<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Availability<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Liability<\u002Fdiv>\n                  <div style=\"padding:13px 18px;border-radius:14px;background:#FFF4E2;font-size:16px;font-weight:800;color:#6E5B44\">Law &amp; changes<\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:16px\">\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:center;gap:14px\">\n                      <div style=\"width:34px;height:34px;border-radius:11px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#4A3000\">1<\u002Fdiv>\n                      <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Using Word Hug<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">By installing the app you agree to these terms. There's no account to create and nothing to sign. Use the app for your own enjoyment; don't try to break it, extract the puzzle database, automate solving, or republish puzzles as your own. If you do, we may stop the app working for you.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:center;gap:14px\">\n                      <div style=\"width:34px;height:34px;border-radius:11px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#4A3000\">2<\u002Fdiv>\n                      <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Purchases &amp; refunds<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">The daily puzzle is free. Hug Packs and nudge coins are one-off purchases made through Apple or Google — not subscriptions, and they don't expire. A pack you buy stays available on any device signed in to the same store account; use Restore purchases to bring it back.<\u002Fdiv>\n                    <div style=\"display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:#FFF9EF\">\n                      <div style=\"width:24px;height:24px;border-radius:8px;background:#FF6B4A;flex-shrink:0;margin-top:2px\"><\u002Fdiv>\n                      <div style=\"flex:1;font-size:16.5px;font-weight:700;color:#6E5B44;line-height:1.5\">Refunds are handled by the store that took your payment. We can't issue them ourselves, but if something went wrong, email us and we'll help you make the request.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Prices are shown by your app store in your own currency and may change. Nudge coins have no cash value, can't be transferred, and aren't refundable once spent on a nudge.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:center;gap:14px\">\n                      <div style=\"width:34px;height:34px;border-radius:11px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#4A3000\">3<\u002Fdiv>\n                      <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Your progress<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Solves, streaks and coin balances live on your device, so deleting the app or losing the phone loses them, and we can't recover them. Purchases are the exception — those can always be restored. Streaks are a keepsake, not a currency: they can't be bought, repaired, or traded.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:center;gap:14px\">\n                      <div style=\"width:34px;height:34px;border-radius:11px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#4A3000\">4<\u002Fdiv>\n                      <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Our content<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">The puzzles, artwork, name and design of Word Hug belong to us. Buying a pack gives you a personal licence to play it, not ownership of the puzzles. Screenshots for reviews, articles, social posts and videos are welcome and need no permission.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:center;gap:14px\">\n                      <div style=\"width:34px;height:34px;border-radius:11px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#4A3000\">5<\u002Fdiv>\n                      <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Availability<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">We intend to keep publishing a puzzle every day, but we're two people — occasionally something breaks. The app is offered as it is. If we ever have to stop the daily puzzle, we'll say so in the app well ahead of time, and packs you've bought will keep working offline.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF4E2;box-shadow:0 5px 0 #EBD6B0;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:center;gap:14px\">\n                      <div style=\"width:34px;height:34px;border-radius:11px;background:#FFB020;box-shadow:0 3px 0 #D98A00;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-size:17px;font-weight:800;color:#4A3000\">6<\u002Fdiv>\n                      <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Liability<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">Word Hug is a word game. To the extent the law allows, we aren't liable for indirect or consequential loss arising from using it, and our total liability is limited to what you've paid us in the previous twelve months. Nothing here limits rights you have as a consumer that can't be limited.<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border-radius:26px;background:#FFF9EF;box-shadow:0 5px 0 #E4CFA8;padding:30px;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"font-family:'Baloo 2',cursive;font-size:28px;font-weight:800;color:#3A2A18\">Law &amp; changes<\u002Fdiv>\n                    <div style=\"font-size:17px;font-weight:700;color:#6E5B44;line-height:1.6;text-wrap:pretty\">These terms are governed by the laws of England and Wales. If we change them we'll update the date above and note what changed; continuing to use the app means you accept the new version. Questions to hello@wordhug.app.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:44px 64px;background:#3A2A18;display:flex;justify-content:space-between;align-items:center\">\n                <div style=\"font-size:14px;font-weight:700;color:#C4B49C\">© 2026 Word Hug<\u002Fdiv>\n                <div style=\"display:flex;gap:28px\">\n                  <div style=\"font-size:15px;font-weight:800;color:#EFE3D2\">About<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:800;color:#EFE3D2\">Contact<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:800;color:#EFE3D2\">Privacy Policy<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;padding-left:10px\">\n              <div style=\"font-family:'Baloo 2',cursive;font-size:19px;font-weight:800;color:#3A2A18\">Terms of Service<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:700;color:#8C7A66\">Numbered tile cards · the app's promises restated as commitments, not disclaimers<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:48px;flex-wrap:wrap;padding-top:22px;border-top:2px solid #DDD1C0\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:46ch\">\n          <div style=\"font-size:11px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#8C7A66\">Carried over from the app<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:700;color:#5E5040;line-height:1.55;text-wrap:pretty\">Amber is still the only shouting colour and appears once per band; teal still means solved; the hard 3–5px bottom edge marks anything you can press. Web adds exactly one thing the app doesn't have: a browser-playable hero, because a screenshot can't show what a minute of this feels like.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-width:40ch\">\n          <div style=\"font-size:11px;font-weight:900;letter-spacing:0.2em;text-transform:uppercase;color:#8C7A66\">Note on the legal pages<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:700;color:#5E5040;line-height:1.55;text-wrap:pretty\">Written to be readable, not to be defensible — treat the copy as a strong first draft and have a lawyer check jurisdiction, liability and consumer-rights wording before launch.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
